# ==============================================================================
# Pipeline de Integração Contínua (CI)
# Propósito: Executar testes unitários utilizando Vitest em ambiente Node.js 24.
# Estrutura modular preparada para futuras expansões de QA e DevOps.
# ==============================================================================

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: eduardo-santos3

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      # 1. Faz o checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # 2. Configura a versão especificada do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto utilizando o Yarn
      - name: Install dependencies
        run: yarn install

      # 5. Executa os testes unitários da aplicação
      - name: Run unit tests
        run: yarn test

  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # 2. Configura a versão especificada do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto utilizando o Yarn
      - name: Install dependencies
        run: yarn install
      
      # 5. Build para o Vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 6. Deploy Preview no Vercel
      - name: Deploy Preview
        run: yarn vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
